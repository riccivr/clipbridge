name: Multi-Architecture Release (macOS Universal, Linux x86_64/ARM64, Windows x64)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    name: macOS Universal (Apple Silicon M1/M2/M3/M4 + Intel)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout unipaste dependency
        uses: actions/checkout@v4
        with:
          repository: riccivr/unipaste
          path: unipaste

      - name: Build Universal macOS Application & DMG
        run: |
          mkdir -p ../unipaste
          cp -R unipaste/* ../unipaste/
          make dmg

      - name: Upload macOS Universal DMG
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ClipBridge-*.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux-and-windows:
    name: Linux (x86_64, arm64) & Windows (x64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout unipaste dependency
        uses: actions/checkout@v4
        with:
          repository: riccivr/unipaste
          path: unipaste

      - name: Install Toolchains (MinGW, AArch64 Cross-Compiler, Zip)
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64 gcc-aarch64-linux-gnu zip

      - name: Setup unipaste engine dependency
        run: |
          mkdir -p ../unipaste
          cp -R unipaste/* ../unipaste/

      - name: Build Source Tarball
        run: make dist

      - name: Build Linux x86_64 Binaries (.deb & .tar.gz)
        run: |
          make clean
          make
          tar -czvf clipbridge-v1.2.2-linux-x86_64.tar.gz clipbridge clipbridge.1 README.md LICENSE
          make deb

      - name: Build Linux ARM64 Binaries (.deb & .tar.gz)
        run: |
          make deb-arm64
          aarch64-linux-gnu-gcc -std=c99 -pedantic -Wall -Wextra -Os -D_DEFAULT_SOURCE -D_BSD_SOURCE -D_POSIX_C_SOURCE=200809L -DVERSION=\"1.2.2\" -I../unipaste clipbridge.c i18n.c platform_posix.c ../unipaste/parser.c ../unipaste/table.c ../unipaste/entity.c ../unipaste/strbuf.c ../unipaste/plugin_none.c -o clipbridge-arm64 -s
          tar -czvf clipbridge-v1.2.2-linux-arm64.tar.gz -C . clipbridge-arm64 clipbridge.1 README.md LICENSE

      - name: Build Windows x64 Binaries (Setup & Portable)
        run: |
          make exe
          cp clipbridge-setup.exe clipbridge-setup-x64.exe
          cp clipbridge-portable.exe clipbridge-portable-x64.exe
          zip -j clipbridge-v1.2.2-windows-x64.zip clipbridge-portable.exe clipbridge.1 README.md LICENSE

      - name: Publish Multi-Architecture Assets to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            clipbridge-*.tar.gz
            clipbridge-v1.2.2-linux-x86_64.tar.gz
            clipbridge-v1.2.2-linux-arm64.tar.gz
            clipbridge_*_amd64.deb
            clipbridge_*_arm64.deb
            clipbridge-setup.exe
            clipbridge-setup-x64.exe
            clipbridge-portable.exe
            clipbridge-portable-x64.exe
            clipbridge-v1.2.2-windows-x64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
