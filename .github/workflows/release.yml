name: Release Matrix (DMG, Linux, Windows, Debian)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos-dmg:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout unipaste dependency
        uses: actions/checkout@v4
        with:
          repository: riccivr/unipaste
          path: unipaste

      - name: Build ClipBridge macOS binary & DMG
        run: |
          mkdir -p ../unipaste
          cp -R unipaste/* ../unipaste/
          make dmg

      - name: Upload macOS DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: clipbridge-macos-dmg
          path: ClipBridge-*.dmg

      - name: Publish DMG to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ClipBridge-*.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-multiplatform:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout unipaste dependency
        uses: actions/checkout@v4
        with:
          repository: riccivr/unipaste
          path: unipaste

      - name: Install MinGW and Zip
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64 zip

      - name: Build Linux binary & Source Tarball
        run: |
          mkdir -p ../unipaste
          cp -R unipaste/* ../unipaste/
          make dist
          make
          tar -czvf clipbridge-linux-x86_64.tar.gz clipbridge clipbridge.1 README.md LICENSE

      - name: Build Debian Package
        run: make deb

      - name: Build Windows Binary (.exe & .zip)
        run: |
          make exe
          zip clipbridge-windows-x64.zip clipbridge.exe clipbridge.1 README.md LICENSE

      - name: Publish Multi-Platform Assets to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            clipbridge-*.tar.gz
            clipbridge-linux-x86_64.tar.gz
            clipbridge_*.deb
            clipbridge.exe
            clipbridge-windows-x64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
